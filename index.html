<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowstate</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Flowstate</h1>
        <p>Enter your flowstate, using our lo-fi study player for focus and relaxation.</p>
    </header>

    <main class="container">
        <section class="player-card">
            <div class="album-art">
                <span>☁</span>
            </div>

            <h2>Ambient Wave</h2>
            <p class="track-info">Music for relaxation / study</p>

            <audio id="audio-player">
                <source src="media/ambient.mp3" type="audio/mpeg">
            </audio>

            <div class="custom-controls">
                <button id="play-pause-btn">Play</button>

                <div class="progress-bar">
                    <span id="progress-bar-fill"></span>
                </div>

                <div class="time-row">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>

                <label>
                    Volume
                    <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.7">
                </label>

                <button id="focus-mode-btn">Enter Focus Mode</button>
            </div>
        </section>

        <section class="focus-panel">
            <h2>Focus Session</h2>
            <p id="focus-message">Use Focus Mode to reduce distractions while studying.</p>
        </section>
    </main>

    <footer>
        <p>Media and icons credited in code comments. Built for Interactive Media assignment.</p>
    </footer>
</body>
</html>
